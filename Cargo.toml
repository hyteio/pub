[workspace]
resolver = "2"
members = ["core", "protocols/*", "formats/*", "cli"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
pub-core = { path = "core" }
pub-stomp = { path = "protocols/stomp" }
pub-mqtt = { path = "protocols/mqtt" }
pub-openwire = { path = "protocols/openwire" }
pub-amqp = { path = "protocols/amqp" }
pub-ramqp = { path = "protocols/ramqp" }
pub-format-json = { path = "formats/json" }
pub-format-xml = { path = "formats/xml" }
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
# Pure-Rust zlib for OpenWire compression (jms.useCompression).
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
percent-encoding = "2"
quick-xml = "0.42"
# preserve_order keeps fields, properties and headers in message order.
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
# `all` adds TcpKeepalive::with_retries (TCP_KEEPCNT) and option getters.
socket2 = { version = "0.6", features = ["all"] }
tempfile = "3"
url = "2"
# url's Unicode host name (IDNA) support only applies to http-like schemes, never
# to pub's: the no-op adapter keeps its tables out of the binary.
idna_adapter = "=1.0.0"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

# Release binaries (`cargo build --profile dist`): built for size. pub waits on
# the network, not the CPU, so `z` costs it little. pub catches no panics, so
# `abort` changes nothing except that a panic at the password prompt would
# leave the terminal's echo off (Ctrl-C and errors still restore it).
[profile.dist]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
