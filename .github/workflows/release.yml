name: Release

# Push a version tag to release: git tag -m "pub 1.0.0" v1.0.0 && git push origin v1.0.0
# The tag must match the workspace version in Cargo.toml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release per tag: a second run for the same tag cancels the first.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check the version and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} doesn't match the workspace version ${version}"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  build:
    name: build ${{ matrix.target }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl: statically linked, so the binaries run on any Linux distribution.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write     # to sign the build attestation
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        run: cargo build --profile dist -p pub-cli --target ${{ matrix.target }}
      - name: package
        run: |
          name="pub-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/dist/pub" LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      # Signed provenance: `gh attestation verify FILE --repo hyteio/pub` proves the archive (or the
      # binary in it) was built here, from this tag's commit.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            pub-*.tar.gz
            target/${{ matrix.target }}/dist/pub
      - uses: actions/upload-artifact@v4
        with:
          name: pub-${{ matrix.target }}
          path: pub-*.tar.gz*

  release:
    name: publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Only the binaries, not the docs job's github-pages artifact.
          pattern: pub-*
          path: dist
          merge-multiple: true
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "pub ${GITHUB_REF_NAME}" \
            --generate-notes

  homebrew:
    name: update the Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    # The `homebrew` environment (limited to v* tags) holds HOMEBREW_TAP_TOKEN: a fine-grained token
    # with contents: write on hyteio/homebrew-tap. Without it, this is skipped.
    environment: homebrew
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        if: env.TAP_TOKEN != ''
      - uses: actions/download-artifact@v4
        if: env.TAP_TOKEN != ''
        with:
          pattern: pub-*
          path: dist
          merge-multiple: true
      - name: write and push the formula
        if: env.TAP_TOKEN != ''
        run: |
          version="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/hyteio/homebrew-tap.git" tap
          mkdir -p tap/Formula
          .github/scripts/homebrew-formula.sh "$version" dist > tap/Formula/pub.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/pub.rb
          git diff --cached --quiet || git commit -m "pub $version"
          git push

  docs:
    needs: check
    permissions:
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
