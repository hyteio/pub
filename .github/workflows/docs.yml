name: Docs

# Publishes this book to GitHub Pages. Releases call it; to publish without a release, run it from
# the Actions tab (Docs → Run workflow) on main.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: publish the documentation
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - name: build
        run: |
          docs/generate.sh
          mdbook build docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book
      - id: deploy
        uses: actions/deploy-pages@v4
