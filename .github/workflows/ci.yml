name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, for new RustSec advisories and broker image updates.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      azure_servicebus:
        description: "Also test against the Azure Service Bus emulator (accepts its and SQL Server's license terms)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: rustfmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Unit tests and end-to-end tests against the in-process mock brokers.
      - run: cargo test --workspace --all-features

  features:
    name: one module at a time
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build with no modules, then each alone
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo build -p pub-cli --no-default-features
          for f in stomp mqtt openwire amqp ramqp json xml; do
            echo "::group::$f"
            cargo build -p pub-cli --no-default-features --features "$f"
            cargo test -p pub-cli --no-default-features --features "$f"
            echo "::endgroup::"
          done

  deny:
    name: advisories, licenses, bans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  interop:
    name: real brokers
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # ActiveMQ Classic, Artemis, RabbitMQ and Mosquitto in Docker (see interop/run.sh).
      - name: interop suite
        env:
          AZURE_SERVICEBUS: ${{ inputs.azure_servicebus && '1' || '' }}
        run: |
          set -o pipefail
          interop/run.sh 2>&1 | tee interop.log
      # Failures as annotations, so they show on the run's page.
      - name: report failures
        if: failure()
        run: |
          grep -E 'panicked at|assertion|^test .* FAILED|^  left:|^ right:|did not start|^error' interop.log \
            | head -60 | while IFS= read -r line; do echo "::error title=interop::${line}"; done

  docs:
    name: documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      # The settings and commands reference is generated from pub itself.
      - name: generated pages are up to date
        run: |
          docs/generate.sh
          git diff --exit-code docs/src/reference || {
            echo "::error::docs/src/reference is out of date: run docs/generate.sh and commit the result"
            exit 1
          }
      - run: mdbook build docs
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: docs/book

  publish-docs:
    name: publish documentation
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
