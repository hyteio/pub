[package]
name = "pub-cli"
publish = false
description = "pub: the curl for messaging"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pub"
path = "src/main.rs"

# The end-to-end tests drive every module and format.
[[test]]
name = "cli"
required-features = ["stomp", "mqtt", "openwire", "amqp", "ramqp", "json", "xml"]

[[test]]
name = "brokers"
required-features = ["stomp", "mqtt", "openwire", "amqp", "ramqp", "json", "xml"]

[features]
default = ["stomp", "mqtt", "openwire", "amqp", "ramqp", "json", "xml"]
# Each protocol module is an optional crate behind a feature of the same name.
stomp = ["dep:pub-stomp"]
mqtt = ["dep:pub-mqtt"]
openwire = ["dep:pub-openwire"]
amqp = ["dep:pub-amqp"]
ramqp = ["dep:pub-ramqp"]
# Message formats beyond the built-in raw and text, likewise.
json = ["dep:pub-format-json"]
xml = ["dep:pub-format-xml"]

[dependencies]
clap.workspace = true
pub-core.workspace = true
pub-stomp = { workspace = true, optional = true }
pub-mqtt = { workspace = true, optional = true }
pub-openwire = { workspace = true, optional = true }
pub-amqp = { workspace = true, optional = true }
pub-ramqp = { workspace = true, optional = true }
pub-format-json = { workspace = true, optional = true }
pub-format-xml = { workspace = true, optional = true }

[dev-dependencies]
pub-stomp = { workspace = true, features = ["mock"] }
pub-mqtt = { workspace = true, features = ["mock"] }
pub-openwire = { workspace = true, features = ["mock"] }
pub-amqp = { workspace = true, features = ["mock"] }
pub-ramqp = { workspace = true, features = ["mock"] }
serde_json.workspace = true
tempfile.workspace = true
